# ABOUTME: CI workflow linting the shell scripts and running the bats suite.
# ABOUTME: Runs on pushes and pull requests targeting main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats tmux jq shellcheck

      - name: Lint scripts
        run: shellcheck scripts/*.sh

      - name: Run tests
        run: bats tests/
